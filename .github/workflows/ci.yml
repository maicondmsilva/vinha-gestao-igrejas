name: Validacao da Vinha

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: vinha-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build da aplicacao
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Instalar dependencias travadas
        run: pnpm install --frozen-lockfile

      - name: Validar build
        run: pnpm run build

      - name: Verificar segredos e botoes
        run: |
          pnpm run check:secrets
          pnpm run check:buttons
          pnpm run check:types:core
          pnpm exec tsc --noEmit -p tsconfig.ledger.json

      - name: Registrar auditoria de dependencias
        run: pnpm audit --json > dependency-audit.json || test -s dependency-audit.json

      - name: Preservar diagnostico de dependencias
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14

      - name: Validar regras de avisos financeiros
        run: |
          node --experimental-strip-types --test scripts/people-summary.test.mjs scripts/people-summary-route.test.mjs
          node --experimental-strip-types --test scripts/cell-directory.test.mjs
          node --experimental-strip-types --test scripts/cell-operations-language.test.mjs
          pnpm run test:central
          node --experimental-strip-types --test scripts/operations-foundation.test.mjs
          node --experimental-strip-types --test scripts/ledger-pilot.test.mjs
          node --experimental-strip-types --test scripts/ledger-recovery.test.mjs scripts/ledger-pending-storage.test.mjs scripts/ledger-report.test.mjs
          node --experimental-strip-types --test scripts/plan-proration.test.mjs
          node --experimental-strip-types --test scripts/plan-change-command.test.mjs

      - name: Validar contencao de recursos nao liberados
        run: pnpm run test:release

      - name: Validar politicas de acesso e protecoes de publicacao
        run: pnpm run test:security

      - name: Instalar CLI oficial do Supabase
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.120.0

      - name: Preparar banco PostgreSQL isolado do CI
        run: supabase db start

      - name: Validar migracoes e permissoes no banco local
        run: supabase test db --local

      - name: Validar governanca com conexoes concorrentes isoladas
        run: |
          pnpm run test:governance-concurrency
          node scripts/ledger-concurrency.mjs
          node scripts/cell-directory-concurrency.mjs
          node scripts/cell-operations-concurrency.mjs

      - name: Parar banco local preservando volumes
        if: always()
        run: supabase stop

