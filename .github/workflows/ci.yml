name: Validacao da Vinha

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: vinha-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build da aplicacao
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Instalar dependencias travadas
        run: pnpm install --frozen-lockfile

      - name: Validar build
        run: pnpm run build

      - name: Validar regras de avisos financeiros
        run: pnpm run test:central

      - name: Validar contencao de recursos nao liberados
        run: pnpm run test:release

